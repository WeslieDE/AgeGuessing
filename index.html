<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}

main{width:100%;max-width:520px;background:var(--card);border-radius:20px;padding:32px 24px}
h1{font-size:1.75rem;line-height:1.25;overflow-wrap:anywhere;margin-bottom:20px}

[hidden]{display:none!important}

button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.main-button{display:block;width:100%;background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.main-button:hover{background:#1a5ea9}

#options button{text-align:left}
#options button[aria-pressed="true"]{background:var(--hover);border-color:var(--blue)}
progress{display:block;width:100%;height:10px;border:0;border-radius:5px;overflow:hidden;background:var(--line);appearance:none;margin-bottom:8px}
progress::-webkit-progress-bar{background:var(--line)}
progress::-webkit-progress-value{background:var(--blue)}
progress::-moz-progress-bar{background:var(--blue)}
.small{font-size:.9375rem;color:var(--soft)}
#count{margin-bottom:20px}
#age{font-size:6rem;font-weight:800;line-height:1.1;color:var(--blue);text-align:center}
#range{text-align:center;margin-bottom:28px}
h2{font-size:1.25rem;margin-bottom:8px}
#top{list-style:none;margin-bottom:24px}

#options .main-button{text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#options .grid button{text-align:center;min-height:76px;padding:6px;font-size:2rem;overflow-wrap:anywhere}
#options .grid.icon button{font-size:1.5rem;white-space:nowrap}
.grid.color{grid-template-columns:repeat(4,minmax(0,1fr))}
#options .grid.color button:hover,#options .grid.fill button:hover{border-color:var(--text)}
.grid.sky{background:linear-gradient(#bfe4ff 75%,#9fd49a 75%);padding:10px;border-radius:12px}
#options .grid.sky button{background:none;border:2px dashed var(--blue)}
#options .grid.sky button:hover{background:#ffe27a}
input[type=range]{width:100%;height:44px;accent-color:var(--blue)}
label{display:block}
.ends{display:flex;justify-content:space-between}
.preview{min-height:110px;display:grid;place-items:center;text-align:center;line-height:1.3}
.clock{width:min(100%,260px);justify-self:center;touch-action:none;cursor:grab;user-select:none}
.clock .face{fill:var(--hover);stroke:var(--blue);stroke-width:4}
.clock text{font-size:16px;fill:var(--text);text-anchor:middle;dominant-baseline:central}
.clock line{stroke:var(--text);stroke-linecap:round;stroke-width:8}
.clock line.minute{stroke:var(--blue);stroke-width:5}
.clock .pin{fill:var(--text)}
.flower{position:relative;width:220px;height:220px;justify-self:center;background:radial-gradient(circle,#ffb02e 0 24px,transparent 25px)}
#options .petal{position:absolute;left:78px;top:78px;width:64px;height:64px;padding:0;border-radius:50%;transform:rotate(var(--turn)) translateY(-66px);border-color:var(--blue)}
#options .tap{justify-self:center;text-align:center;width:150px;height:150px;border-radius:50%;font-size:2rem;font-weight:800;user-select:none;touch-action:manipulation}
#options.multi button[data-option]::before{content:"☐";margin-right:10px}
#options.multi button[data-option][aria-pressed="true"]::before{content:"☑"}
#options.multi .main-button{text-align:center}
#options.multi .main-button:disabled{background:var(--blue)}
#copy{display:block;width:100%;margin-top:10px}
footer{max-width:520px;text-align:center}
</style>
</head>
<body>
<main>
  <section id="intro">
    <h1>Can we guess your age?</h1>
    <p style="margin-bottom:24px">Answer 12 short questions and do 2 small tasks.</p>
    <button class="main-button" id="start">Start</button>
  </section>

  <section id="quiz" hidden>
    <progress id="progress" max="14" value="0" aria-label="Steps done"></progress>
    <p class="small" id="count"></p>
    <h1 id="qtext" tabindex="-1"></h1>
    <div id="options"></div>
    <button class="link" id="back">Back</button>
  </section>

  <section id="result" hidden>
    <h1 id="rtitle" tabindex="-1" style="text-align:center">I think you are</h1>
    <p id="age"></p>
    <p id="range"></p>
    <div id="reasons">
      <h2>What helped us most</h2>
      <ol id="top"></ol>
    </div>
    <button class="main-button" id="again">Play again</button>
    <button id="copy">Copy result</button>
    <p class="small" id="copied" role="status"></p>
  </section>
</main>
<footer class="small">Just a game, not a real age test. Your answers are not sent or saved.</footer>

const el = (tag, props = {}, ...children) => { const n = Object.assign(document.createElement(tag), props); n.append(...children); return n; };

// Draws one task into the box and calls done(outcomeIndex, button).
function renderTask(task, box, done){
  const [, , , outcomes, , kind, set] = task;
  const finishButton = result => {
    const b = el("button", {type:"button", className:"main-button", textContent:"Done"});
    b.addEventListener("click", () => done(result(), b));
    return b;
  };

  if (kind === "pick"){
    const grid = el("div", {className:"grid " + set.view});
    const order = set.view === "sky" ? set.icons.map((_, i) => i) : shuffle(set.icons.map((_, i) => i));
    for (const i of order){
      const b = el("button", {type:"button", title:outcomes[i][0]});
      b.setAttribute("aria-label", outcomes[i][0]);
      if (set.view === "color" || set.view === "fill") b.style.background = set.icons[i];
      else if (set.view !== "sky") b.textContent = set.icons[i];
      b.addEventListener("click", () => done(i, b));
      grid.append(b);
    }
    box.append(grid);
  }

  if (kind === "slider"){
    const preview = el("div", {className:"preview"});
    const input = el("input", {type:"range", min:set.min, max:set.max, value:set.start});
    input.setAttribute("aria-label", `from ${set.low} to ${set.high}`);
    const draw = () => {
      const v = Number(input.value);
      if (set.preview === "text"){ preview.textContent = "The cat sleeps in the sun."; preview.style.fontSize = v + "px"; }
      else { preview.textContent = ["😫","😪","😐","🙂","😄"][Math.min(4, Math.floor(v / 20))]; preview.style.fontSize = "64px"; }
    };
    input.addEventListener("input", draw); draw();
    box.append(preview, input, el("p", {className:"ends small"}, el("span", {textContent:set.low}), el("span", {textContent:set.high})),
      finishButton(() => set.cuts.filter(c => Number(input.value) > c).length));
  }

  if (kind === "clock"){
    let hour = 12, minute = 0;
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "-110 -110 220 220"); svg.setAttribute("class", "clock"); svg.setAttribute("aria-hidden", "true");
    const add = (tag, attrs, text = "") => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); n.textContent = text; svg.append(n); return n; };
    add("circle", {r:104, class:"face"});
    for (let n = 1; n <= 12; n++) add("text", {x:Math.sin(n * Math.PI / 6) * 84, y:-Math.cos(n * Math.PI / 6) * 84}, n);
    const hHand = add("line", {class:"hour"}), mHand = add("line", {class:"minute"});
    add("circle", {r:6, class:"pin"});
    const slider = (label, min, max, value) => {
      const input = el("input", {type:"range", min, max, value});
      box.append(el("label", {className:"small"}, label, input));
      return input;
    };
    box.append(svg);
    const hInput = slider("Short hand", 1, 12, 12), mInput = slider("Long hand", 0, 59, 0);
    const point = (line, turn, length) => { line.setAttribute("x2", Math.sin(turn * 2 * Math.PI) * length); line.setAttribute("y2", -Math.cos(turn * 2 * Math.PI) * length); };
    const draw = () => { hInput.value = hour; mInput.value = minute; point(hHand, (hour % 12 + minute / 60) / 12, 50); point(mHand, minute / 60, 72); };
    hInput.addEventListener("input", () => { hour = Number(hInput.value); draw(); });
    mInput.addEventListener("input", () => { minute = Number(mInput.value); draw(); });
    // Drag a hand: touch near the middle moves the short one, further out the long one.
    let dragging = null;
    const move = e => {
      const r = svg.getBoundingClientRect();
      const x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
      dragging ??= Math.hypot(x, y) / (r.width / 2) < .55 ? "hour" : "minute";
      const turn = (Math.atan2(x, -y) / (2 * Math.PI) + 1) % 1;
      if (dragging === "minute") minute = Math.round(turn * 60) % 60;
      else hour = Math.round(turn * 12 - minute / 60 + 12) % 12 || 12;
      draw();
    };
    svg.addEventListener("pointerdown", e => { dragging = null; svg.setPointerCapture(e.pointerId); move(e); });
    svg.addEventListener("pointermove", e => { if (svg.hasPointerCapture(e.pointerId)) move(e); });
    draw();
    box.append(finishButton(() => {
      const afternoon = hour === 12 ? true : hour <= 5 || (hour === 6 && minute === 0);
      if (!afternoon) return 4;
      if (hour === 3 && minute === 0) return 0;
      if (minute === 0) return 1;
      return minute % 15 === 0 ? 2 : 3;
    }));
  }

  if (kind === "flower"){
    const colors = ["#fff","#e5484d","#ffd02f","#3fa45b","#2f7fd8","#8e5bd6"];
    const state = [0,0,0,0,0,0];
    const flower = el("div", {className:"flower"});
    state.forEach((_, i) => {
      const petal = el("button", {type:"button", className:"petal"});
      petal.setAttribute("aria-label", `Petal ${i + 1}`);
      petal.style.setProperty("--turn", i * 60 + "deg");
      petal.addEventListener("click", () => { state[i] = (state[i] + 1) % colors.length; petal.style.background = colors[state[i]]; });
      flower.append(petal);
    });
    box.append(flower, finishButton(() => {
      const used = new Set(state.filter(Boolean)).size;
      return used === 0 ? 3 : used === 1 ? 0 : used === 2 ? 1 : 2;
    }));
  }

  if (kind === "tap"){
    let taps = 0;
    const big = el("button", {type:"button", className:"tap", textContent:"Tap"});
    const ready = finishButton(() => taps <= 2 ? 0 : taps <= 9 ? 1 : taps <= 24 ? 2 : 3);
    ready.disabled = true;
    big.addEventListener("click", () => { taps++; big.textContent = taps; ready.disabled = false; });
    box.append(big, ready);
  }

}

const MIN_PICKS = 2;

/* ---------- Guessing: Bayesian estimate over ages 7..80 ---------- */
const AGES = Array.from({length:74}, (_,i) => i + 7);
const PER_ROUND = 10, MULTI_PER_ROUND = 2, TASKS_PER_ROUND = 2;

const affinity = (opt, age) => {
  if (opt.length === 1) return 0.3;
  // The oldest answers stay open upwards.
  const distance = opt[1] >= 46 && age > opt[1] ? 0 : (age - opt[1]) / opt[2];
  return 0.04 + Math.exp(-0.5 * distance ** 2);
};
const likelihood = (q, i, age) => affinity(q[3][i], age) / q[3].reduce((s, o) => s + affinity(o, age), 0);
const prior = a => Math.exp(-0.5 * ((a - 32) / 26) ** 2);

function estimate(picks){
  let p = AGES.map(prior);
  for (const {q, i} of picks){
    const chosen = [].concat(i).filter(n => q[3][n].length > 1);
    for (const n of chosen) p = p.map((v, k) => v * likelihood(q, n, AGES[k]) ** ((q[4] ?? 1) / chosen.length));
  }
  const sum = p.reduce((a, b) => a + b, 0);
  const quantile = t => { let c = 0; for (let k = 0; k < p.length; k++){ c += p[k] / sum; if (c >= t) return AGES[k]; } return AGES.at(-1); };
  const mean = p.reduce((s, v, k) => s + v * AGES[k], 0) / sum;
  return { mean, age: quantile(.5), low: quantile(.15), high: quantile(.85) };
}

/* ---------- New questions every round ---------- */
const store = {
  get(){ try { const v = JSON.parse(localStorage.getItem("agequiz.seen")); return Array.isArray(v) ? v.filter(Number.isInteger) : []; } catch { return []; } },
  set(v){ try { localStorage.setItem("agequiz.seen", JSON.stringify(v)); } catch { /* private mode */ } }
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function drawRound(){
  let seen = new Set(store.get());
  const normal = BANK.filter(q => q[1] !== "trap");
  const traps = rotate("agequiz.traps", BANK.filter(q => q[1] === "trap"), Math.random() < .5 ? 1 : 2);
  const wanted = PER_ROUND - traps.length;
  let fresh = normal.filter(q => !seen.has(q[0]));
  let picked = [];
  if (fresh.length < wanted){ picked = fresh; seen = new Set(fresh.map(q => q[0])); fresh = normal.filter(q => !seen.has(q[0])); }
  const groups = {};
  for (const q of shuffle(fresh)) (groups[q[1]] ??= []).push(q);
  const names = shuffle(Object.keys(groups));
  while (picked.length < wanted){
    for (const n of names){
      const q = picked.length < wanted && groups[n].shift();
      if (q) picked.push(q);
    }
  }
  picked.forEach(q => seen.add(q[0]));
  store.set([...seen]);
  return shuffle([...picked, ...traps]);
}

// Takes "count" items that were not seen lately, using its own memory.
function rotate(key, pool, count){
  let seen = [];
  try { const v = JSON.parse(localStorage.getItem(key)); if (Array.isArray(v)) seen = v; } catch { /* start fresh */ }
  let picked = shuffle(pool.filter(t => !seen.includes(t[0]))).slice(0, count);
  if (picked.length < count){
    seen = [];
    picked = picked.concat(shuffle(pool.filter(t => !picked.includes(t)))).slice(0, count);
  }
  try { localStorage.setItem(key, JSON.stringify([...seen, ...picked.map(t => t[0])])); } catch { /* private mode */ }
  return picked;
}

const $ = id => document.getElementById(id);

function show(section){

function start(){
  round = drawRound(); answers = []; index = 0;
  const multi = rotate("agequiz.multi", MULTI, MULTI_PER_ROUND);
  const tasks = rotate("agequiz.tasks", TASKS, TASKS_PER_ROUND);
  // steps 3 and 9 are multiple choice, steps 6 and 12 are tasks
  [[2, multi[0]], [5, tasks[0]], [8, multi[1]], [11, tasks[1]]].forEach(([at, step]) => round.splice(at, 0, step));
  // Mixed order; answers like "Something else" stay last.
  orders = round.map(q => {
    if (q[1] === "task") return [];
    const all = q[3].map((_, i) => i);
    return [...shuffle(all.filter(i => q[3][i].length > 1)), ...all.filter(i => q[3][i].length === 1)];
  });
  show("quiz"); renderQuestion();
}

function renderQuestion(){
  const q = round[index];
  locked = false;
  $("progress").value = index;
  $("progress").max = round.length;
  $("count").textContent = `${index + 1} of ${round.length}`;
  $("qtext").textContent = q[2];
  $("back").hidden = index === 0;
  $("options").replaceChildren(...orders[index].map(opt => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String([].concat(answers[index] ?? []).includes(opt)));
    b.dataset.option = opt;
    b.textContent = q[3][opt][0];
    b.addEventListener("click", () => {
      if (q[1] !== "multi") return choose(opt, b);
      b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
      b.dispatchEvent(new Event("toggled", {bubbles:true}));
    });
    return b;
  }));
  $("options").classList.toggle("task", q[1] === "task");
  $("options").classList.toggle("multi", q[1] === "multi");
  if (q[1] === "task") renderTask(q, $("options"), choose);
  if (q[1] === "multi") renderMulti($("options"));
  $("qtext").focus({preventScroll:true});
  window.scrollTo(0, 0);
}

function renderMulti(box){
  const chosen = () => [...box.querySelectorAll('[data-option][aria-pressed="true"]')].map(b => Number(b.dataset.option));
  const hint = el("p", {className:"small", textContent:`Choose ${MIN_PICKS} or more.`});
  const done = el("button", {type:"button", className:"main-button", textContent:"Done"});
  const update = () => { done.disabled = chosen().length < MIN_PICKS; };
  done.addEventListener("click", () => choose(chosen(), done));
  box.prepend(hint);
  box.append(done);
  box.querySelectorAll("[data-option]").forEach(b => b.addEventListener("toggled", update));
  update();
}

function choose(opt, button){
  if (locked) return;
  locked = true;
  answers[index] = opt;
  if (!Array.isArray(opt)) button.setAttribute("aria-pressed", "true");
  const at = index, current = round;
  setTimeout(() => {
    if (round !== current || index !== at) return; // went back meanwhile
    if (++index < round.length) renderQuestion(); else finish();
  }, 200);
}

// The 4 answers that move the guess the most: compare the result with and without each one.
function showReasons(picks, result){
  const top = picks
    .filter(({q, i}) => [].concat(i).some(n => q[3][n].length > 1))
    .map(x => ({...x, pull: result.mean - estimate(picks.filter(y => y !== x)).mean}))
    .sort((a, b) => Math.abs(b.pull) - Math.abs(a.pull))
    .slice(0, 4);
  const line = (text, className = "") => { const p = document.createElement("p"); p.textContent = text; p.className = className; return p; };
  $("top").replaceChildren(...top.map(({q, i, pull}) => {
    const many = Array.isArray(i);
    const [answer, age] = many ? [i.map(n => q[3][n][0]).join(", ")] : q[3][i];
    const isTask = q[1] === "task";
    const years = Math.round(Math.abs(pull));
    const effect = years < 1 ? "It changed our guess only a little."
      : `It made our guess about ${years} ${years === 1 ? "year" : "years"} ${pull > 0 ? "older" : "younger"}.`;
    const item = document.createElement("li");
    const chosen = line(`${isTask ? "You made" : "You chose"}: ${answer}`);
    chosen.style.fontWeight = "700";
    item.append(line(q[2], "small"), chosen,
      line(`${WHY[q[0]]} ${many ? "" : `We think this answer is typical for ${typicalFor(age)}. `}${effect}`));
    return item;
  }));
  $("reasons").hidden = top.length === 0;
}

function finish(){
  const picks = round.map((q, n) => ({q, i: answers[n]}));
  const r = estimate(picks);
  showReasons(picks, r);
  show("result");
  $("age").textContent = r.age;
  $("range").textContent = `Maybe between ${r.low} and ${r.high}.`;
  summary = `The quiz thinks I am ${r.age}.`;
  $("copied").textContent = "";
  $("rtitle").focus({preventScroll:true});
  window.scrollTo(0, 0);
}

$("start").addEventListener("click", start);
$("again").addEventListener("click", start);
$("back").addEventListener("click", () => { if (index > 0){ index--; renderQuestion(); } });
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(summary); $("copied").textContent = "Copied."; }
  catch { $("copied").textContent = summary; }
});
document.addEventListener("keydown", e => {
  if ($("quiz").hidden || round[index]?.[1] === "task" || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  $("options").querySelectorAll("button")[Number(e.key) - 1]?.click();
});
</script>
</body>
</html>
